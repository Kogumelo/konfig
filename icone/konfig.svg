<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- Ícone do Konfig: interruptor ligado com o K no trilho.
       Placa no gabarito do macOS (84 de lado dentro de 100, raio 19).
       K: o desenho de 20 de altura ampliado 1,2x (24 de altura), centrado no trilho.
       Trilho de 64, centrado na placa; a bola fica a 4 da ponta direita do trilho. -->
  <defs>
    <linearGradient id="placa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f8"/><stop offset="1" stop-color="#d5dce8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="84" height="84" rx="19" fill="url(#placa)" stroke="#000" stroke-opacity=".10" stroke-width=".8"/>
  <rect x="18" y="32" width="64" height="36" rx="18" fill="#22314f"/>
  <circle cx="64" cy="50" r="14" fill="#fff"/>
  <g fill="#f4b740" transform="translate(28 38) scale(1.2) translate(-28 -40)">
    <rect x="28" y="40" width="5" height="20" rx=".8"/>
    <polygon points="32,51 40.5,40 46,40 35.5,53"/>
    <polygon points="35,48 46,60 40.5,60 32,52"/>
  </g>
</svg>
