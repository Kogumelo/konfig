; Each rule of Konfig's INI dialect (see README, "INI dialect").
# comment with a hash

;; comment right above a key becomes help
before_section = goes to "General"
colon: separator ':'
  indented   =   spaces at the ends do not count   
empty =
empty_with_comment =   ; only a comment
attached_semicolon = a;b
attached_hash = a#b
url = http://x/#a
comment_at_end = value ; comment
comment_tab = value	# after a tab
color = #DD0000
equals_in_value = a=b=c
colon_in_value = c:\folder
interpolation = %(home)s/bin and ${HOME}

[ section with spaces ]
double = "  with spaces ; and # inside  "
single = 'quotes "double" inside'
double_comment = "x"  ; after the quotes
double_empty = ""
accents = ação 😀
# a | b | c
choice = b

[a.b]   ; dot is literal
x = 1

[*.[ch]]
indent_size = 4

[remote "origin"]
url = git@example:repo.git

[a.b]
; repeated section continues the first one
y = 2
