; Cada regra do dialeto INI do Konfig (ver README, "Dialeto INI").
# comentário com cerquilha

;; comentário logo acima de uma chave vira ajuda
antes_da_secao = vai para "Geral"
dois_pontos: separador ':'
  recuada   =   espaços nas pontas não contam   
vazia =
vazia_com_comentario =   ; só comentário
ponto_e_virgula_colado = a;b
cerquilha_colada = a#b
url = http://x/#a
comentario_no_fim = valor ; comentário
comentario_tab = valor	# depois de tabulação
cor = #DD0000
igual_no_valor = a=b=c
dois_pontos_no_valor = c:\pasta
interpolacao = %(home)s/bin e ${HOME}

[ seção com espaços ]
duplas = "  com espaços ; e # dentro  "
simples = 'aspas "duplas" dentro'
duplas_comentario = "x"  ; depois das aspas
duplas_vazias = ""
acentos = ação 😀
# a | b | c
escolha = b

[a.b]   ; ponto é literal
x = 1

[*.[ch]]
indent_size = 4

[remote "origin"]
url = git@exemplo:repo.git

[a.b]
; seção repetida continua a primeira
y = 2
