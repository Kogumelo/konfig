; Example configuration (INI), with CRLF line breaks (Windows style).
; Every value is text; ${VAR} and %(x)s are not expanded.

# keys before the first section go to the "General" section
name = Kogumelo Dashboard
version: 3

[server]
; Address the server listens on
host = 0.0.0.0
port = 8080
# debug | info | warning | error
log_level = info
title = "Kogumelo Dashboard"   ; the quotes stay on save
; the # without a space before it is part of the value
url = http://x/#a

[database]
; firebird | postgres
driver = firebird
pool = 12  ; simultaneous connections
password = 'change;this password'
path = ${HOME}/data.fdb

[php]
; one extension per line (PHP-style array)
extensions[] = curl
extensions[] = gd
extensions[] = intl
memory_limit = 128M
; highlight color: the # at the start of the value is part of the value
color = #DD0000

[log.file]
; the dot is part of the name: there is no "file" subsection inside "log"
destination = /var/log/konfig.log
