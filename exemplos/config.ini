; Configuração de exemplo (INI), com quebras de linha CRLF (estilo Windows).
; Todo valor é texto; ${VAR} e %(x)s não são expandidos.

# chaves antes da primeira seção ficam na seção "Geral"
nome = Painel Kogumelo
versao: 3

[servidor]
; Endereço em que o servidor escuta
host = 0.0.0.0
porta = 8080
# debug | info | aviso | erro
nivel_log = info
titulo = "Painel Kogumelo"   ; as aspas ficam ao gravar
; o # sem espaço antes faz parte do valor
url = http://x/#a

[banco]
; firebird | postgres
driver = firebird
pool = 12  ; conexões simultâneas
senha = 'troque;esta senha'
caminho = ${HOME}/dados.fdb

[php]
; uma extensão por linha (lista no estilo PHP)
extensoes[] = curl
extensoes[] = gd
extensoes[] = intl
memory_limit = 128M
; cor de destaque: o # no começo do valor é valor
cor = #DD0000

[log.arquivo]
; o ponto é parte do nome: não há subseção "arquivo" dentro de "log"
destino = /var/log/km-conf.log
